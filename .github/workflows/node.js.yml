name: Node.js CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'AGENTS.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'docs/RELEASING.md'
      - 'scripts/release.cjs'
      - '.npmrc'
      - '.github/workflows/**'
      - 'jest.config.*'
      - '.eslintrc*'
      - '.prettier*'
      - 'knip.json'
      - 'forge.config.*'
      - 'webpack.*'
      - 'tsconfig.*'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'AGENTS.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'docs/RELEASING.md'
      - 'scripts/release.cjs'
      - '.npmrc'
      - '.github/workflows/**'
      - 'jest.config.*'
      - '.eslintrc*'
      - '.prettier*'
      - 'knip.json'
      - 'forge.config.*'
      - 'webpack.*'
      - 'tsconfig.*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Validate release metadata
        run: npm run release:check
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Typecheck
        run: npm run typecheck
      - name: Check unused code
        run: npm run knip
      - name: Test
        run: npm test -- --runInBand --detectOpenHandles
      - name: Audit production dependencies
        run: npm audit --omit=dev --registry=https://registry.npmjs.org
      - name: Package
        run: npm run package
